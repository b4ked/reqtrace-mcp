[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "reqtrace-mcp"
version = "0.1.0"
description = "MCP server that makes coding agents prove their work: requirements traceability, verification evidence and human sign-off."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Hishan Parry" }]
keywords = ["mcp", "requirements", "traceability", "verification", "claude-code", "agents"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Testing",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
  "mcp>=2.3,<3",
  "pyyaml>=6",
  "coverage>=7.6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11", "types-PyYAML"]
eval = ["matplotlib>=3.8"]

[project.scripts]
reqtrace = "reqtrace_mcp.cli:main"
reqtrace-mcp = "reqtrace_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/reqtrace_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["verifies(*req_ids): links a test to the requirements it verifies"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/reqtrace_mcp"]
