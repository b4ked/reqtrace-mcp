# Requirements for google/crc32c, written for this case study.
#
# google/crc32c has no requirements document. These were written from public sources only:
# RFC 3720 (iSCSI) section 12.1 and appendix B.4 for the algorithm and test vectors, the
# library's public header comments and README for the API, and the standard CRC-32/ISCSI
# check value. Every test vector below was checked against an independent bit-by-bit
# implementation before use. They are this project's reading of the library, not its
# authors' requirements.

- id: CRC-001
  title: CRC-32C value of a buffer
  text: >-
    The library shall compute the CRC-32C (Castagnoli) checksum of a byte buffer: polynomial
    0x1EDC6F41, reflected input and output, initial value and final XOR 0xFFFFFFFF.
  rationale: The checksum used by iSCSI, SCTP, ext4 and others (RFC 3720 section 12.1).
  acceptance:
    - 32 bytes of 0x00 -> 0x8A9136AA (RFC 3720 B.4)
    - 32 bytes of 0xFF -> 0x62A8AB43 (RFC 3720 B.4)
    - bytes 0x00, 0x01, ..., 0x1F -> 0x46DD794E (RFC 3720 B.4)
    - bytes 0x1F, 0x1E, ..., 0x00 -> 0x113FDB5C (RFC 3720 B.4)
    - ASCII "123456789" -> 0xE3069283 (the standard CRC-32/ISCSI check value)
  tags: [api]

- id: CRC-002
  title: Incremental computation
  text: >-
    Extending the CRC of buffer A with buffer B shall give the CRC of A followed by B, for
    every split point, so data can be checksummed in pieces.
  acceptance:
    - Extend(Crc32c("hello "), "world") == Crc32c("hello world")
    - every split of a 48-byte buffer into up to three pieces gives the whole-buffer CRC
  tags: [api]

- id: CRC-003
  title: Empty input
  text: >-
    The CRC of an empty buffer shall be 0, and extending any CRC with zero bytes shall return
    that CRC unchanged.
  acceptance:
    - Crc32c(data, 0) == 0
    - Extend(0x12345678, data, 0) == 0x12345678
  tags: [api, boundary]

- id: CRC-004
  title: C API
  text: >-
    The C functions crc32c_value and crc32c_extend shall return the same results as the C++
    functions Crc32c and Extend.
  acceptance:
    - crc32c_value gives the CRC-001 vectors
    - crc32c_extend(crc32c_value("hello "), "world") == crc32c_value("hello world")
  tags: [api, c]

- id: CRC-005
  title: Convenience overloads
  text: >-
    The C++ overloads taking const char*, std::string, std::string_view and std::byte* shall
    return the same CRC as the uint8_t* form for the same bytes.
  acceptance:
    - each overload gives the CRC-001 vectors
  tags: [api]

- id: CRC-006
  title: Hardware acceleration with identical results
  text: >-
    The library shall use the CPU's CRC32C instructions (SSE4.2 on x86-64, the CRC32
    extension on ARM64) when the CPU supports them, and a portable implementation otherwise.
    Every implementation shall return the same results.
  rationale: Speed without changing results; the choice is made at run time.
  acceptance:
    - portable, SSE4.2 and ARM64 implementations each give the CRC-001 and CRC-002 results
    - on a CPU without the instructions, the portable implementation is used
  tags: [performance, portability]

- id: CRC-007
  title: Little-endian loads
  parent: CRC-006
  text: >-
    The 16-, 32- and 64-bit loads used by the implementations shall read memory as
    little-endian regardless of the host's byte order.
  acceptance:
    - bytes 78 56 34 12 read as a 32-bit value -> 0x12345678
    - 16-bit and 64-bit loads follow the same rule
  tags: [derived]

- id: CRC-008
  title: Alignment helper
  parent: CRC-006
  text: >-
    Rounding a pointer or integer up to an N-byte boundary (N a power of two) shall return
    the smallest multiple of N that is not less than the input.
  acceptance:
    - RoundUp<4>(5) == 8, RoundUp<4>(8) == 8
  tags: [derived]
